<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Studio — Infinite Pixel Art Canvas</title>
<style>
:root{--bg:#e9e6df;--ui:#fbfaf7;--ink:#26262b;--mute:#76736b;--line:#d9d5ca;--acc:#1f6f4a;--ck1:#f2efe8;--ck2:#e5e1d6;--paper:#f7f3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1e;--ui:#2a2a2e;--ink:#ecebe6;--mute:#9a978f;--line:#3d3d42;--acc:#34a872;--ck1:#232327;--ck2:#1c1c20;--paper:#1e1e22}}
:root[data-theme="dark"]{--bg:#1b1b1e;--ui:#2a2a2e;--ink:#ecebe6;--mute:#9a978f;--line:#3d3d42;--acc:#34a872;--ck1:#232327;--ck2:#1c1c20;--paper:#1e1e22}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#g{position:fixed;left:0;top:0;touch-action:none;cursor:crosshair;outline:none;image-rendering:pixelated}
.box{position:fixed;background:var(--ui);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:10}
#bar{top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);display:flex;flex-wrap:wrap;gap:5px 7px;align-items:center;justify-content:center;padding:6px 9px}
#rail{left:8px;top:98px;display:flex;flex-direction:column;gap:3px;padding:5px;width:84px;max-height:calc(100% - 196px);overflow:auto}
#panel{right:8px;top:98px;width:210px;padding:8px;max-height:calc(100% - 196px);overflow:auto}
#timeline{bottom:calc(env(safe-area-inset-bottom,0px) + 42px);left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);display:flex;align-items:center;gap:6px;padding:5px 9px;overflow-x:auto}
button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 7px;cursor:pointer;transition:border-color .1s,background .1s}
button:hover,select:hover{border-color:var(--mute)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.clutch-on{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled,input:disabled{opacity:.35;cursor:default}
label{color:var(--mute);display:flex;align-items:center;gap:4px}
input[type=range]{width:56px;accent-color:var(--ink);cursor:pointer}
#panel input[type=range]{width:100%}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:4px 0;gap:6px}
#panel label input[type=range]{flex:1}
h4{margin:7px 0 4px;display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
h4:first-child{margin-top:0}
.sep{height:1px;background:var(--line);margin:2px 0}
.row{display:flex;gap:3px;margin:2px 0;align-items:center}.row .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .nm{border-color:var(--ink);font-weight:600}.mini{padding:2px 5px;font-size:11px}
#palGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:4px 0}
.sw{width:100%;aspect-ratio:1/1;border-radius:4px;padding:0;border:1.5px solid var(--ui);outline:1px solid var(--line);cursor:pointer}
.sw.on{outline:2px solid var(--ink);transform:scale(1.06)}
.sw.bg-on{outline:2px dashed var(--mute)}
input[type=color]{width:24px;height:22px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
#previewWrap{display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(var(--ck1) 0% 25%,var(--ck2) 0% 50%) 50%/12px 12px;border:1px solid var(--line);border-radius:8px;height:96px;overflow:hidden;margin-bottom:4px}
#prevC{image-rendering:pixelated;max-width:92px;max-height:90px}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:11px;white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
#fList{display:flex;gap:4px;align-items:center;overflow-x:auto;max-width:46vw;padding:1px 0}
#status{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);padding:4px 14px;border-radius:999px;color:var(--mute);white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis}
#status b{color:var(--ink)}
#status b.cl{color:var(--acc)}
@media(max-width:780px){#panel{display:none}}
</style></head><body>
<canvas id="g" tabindex="-1"></canvas>
<div id="rail" class="box"></div>
<div id="bar" class="box">
<input type="color" id="col" value="#26262b" title="Primary (FG) Colour">
<input type="color" id="colBg" value="#f7f3ea" title="Secondary (BG) Colour — right-click or Shift+draw uses BG">
<button id="swapCol" class="mini" title="Swap Primary / Secondary colours (X)">⇄</button>
<label title="Brush size in pixels (1–24px)">Px<input id="size" type="range" min="1" max="24" step="1" value="1"><span id="sizeVal">1</span></label>
<button id="pxPerf" class="on" title="Pixel-Perfect mode: removes accidental L-corners on 1px freehand lines">Px-Perf</button>
<button id="fillShp" title="Fill shapes (Rect / Oval)">Fill</button>
<select id="dithPat" title="Dither pattern for Dither &amp; Gradient tools">
<option value="0">Dither: 50% checker</option>
<option value="1">Dither: 25% sparse</option>
<option value="2">Dither: 75% dense</option>
<option value="3">Dither: diagonal</option>
</select>
<select id="mode" title="Trackpad drawing mode">
<option value="clutch">Ctrl clutch + drag</option>
<option value="drag">Press &amp; drag</option>
<option value="flow">Free-flow (finger = pen)</option>
</select>
<button id="clutchBtn" title="Hold CTRL and move your finger on the mousepad to auto-draw pixels without clicking (or click to lock)">Ctrl Clutch</button>
<select id="csize" title="Infinite canvas guide / tile box (drawing is unrestricted everywhere)">
<option value="inf" selected>Canvas: Infinite</option>
<option value="16x16">Guide: 16×16</option>
<option value="32x32">Guide: 32×32</option>
<option value="64x64">Guide: 64×64</option>
<option value="128x128">Guide: 128×128</option>
<option value="256x256">Guide: 256×256</option>
</select>
<select id="bgStyle" title="Infinite canvas backdrop">
<option value="paper">Bg: Warm paper</option>
<option value="checker">Bg: Checker</option>
<option value="tan">Bg: Toned tan</option>
<option value="dark">Bg: Dark slate</option>
</select>
<button id="gridBtn" class="on" title="Toggle pixel &amp; chunk grid overlay">Grid</button>
<button id="tileBtn" title="Toggle 3×3 seamless tile repeat preview">Tiled 3×3</button>
<select id="sym" title="Symmetry mirror axis (drag red axis dot to move anywhere on infinite canvas)">
<option value="0">Sym: off</option>
<option value="1">Sym: H</option>
<option value="2">Sym: V</option>
<option value="3">Sym: 4-way</option>
</select>
<button id="onionBtn" title="Toggle Onion Skin (previous/next animation frame ghost)">Onion</button>
<button id="zo" title="Zoom out (−)">−</button><button id="zv" title="Reset zoom (1)">100%</button><button id="zi" title="Zoom in (+)">+</button><button id="fit" title="Fit entire pixel artwork to screen (0)">Fit</button>
<button id="bUndo" title="Undo (Ctrl+Z / Z)">Undo</button><button id="bRedo" title="Redo (Ctrl+Shift+Z / Y)">Redo</button>
<button id="img" title="Load low-opacity reference image to trace over">+ Ref</button>
<select id="expScale" title="Export scale factor">
<option value="1">1×</option>
<option value="2">2×</option>
<option value="4" selected>4×</option>
<option value="8">8×</option>
<option value="16">16×</option>
</select>
<button id="save" title="Export artwork bounds as crisp nearest-neighbor PNG">Save PNG</button>
<button id="saveSheet" title="Export all animation frames as a horizontal spritesheet PNG">Sheet PNG</button>
<button id="themeBtn" title="Toggle light / dark UI chrome">◐</button>
<input type="file" id="file" accept="image/*" hidden>
</div>

<div id="panel" class="box">
<h4>Preview <span><button class="mini" id="outlineBtn" title="Add 1px FG outline around opaque pixels">Outline</button> <button class="mini" id="flipH" title="Flip artwork horizontally">⇄</button> <button class="mini" id="flipV" title="Flip artwork vertically">⇅</button> <button class="mini" id="rot90" title="Rotate artwork 90° CW">↻</button></span></h4>
<div id="previewWrap"><canvas id="prevC"></canvas></div>
<h4>Palette <span><select id="palSel" class="mini" title="Switch pixel art palette"><option value="pico8">PICO-8 (16)</option><option value="sweetie16">Sweetie 16</option><option value="gb">Game Boy (4)</option><option value="endesga">Endesga 24</option></select> <button class="mini" id="addSw" title="Add current FG colour to palette">+</button></span></h4>
<div id="palGrid"></div>
<h4>Layers <span><button class="mini" id="mergeL" title="Merge active layer down">⇊</button> <button class="mini" id="clr" title="Clear active cel">Clear</button> <button class="mini" id="addL" title="Add new layer">+</button></span></h4>
<div id="ll"></div>
<label>Opacity<input id="lop" type="range" min="0" max="1" step=".05" value="1"></label>
<h4>Reference <span><button class="mini" id="clrRef" title="Remove reference image">Clear</button></span></h4>
<label>Opacity<input id="rop" type="range" min="0" max="1" step=".05" value=".35"></label>
<label>Scale<input id="rsc" type="range" min="10" max="400" value="100"></label>
</div>

<div id="timeline" class="box">
<button id="playBtn" class="mini" title="Play / pause animation (Enter)">▶ Play</button>
<label title="Animation playback speed">FPS<input id="fps" type="range" min="1" max="24" step="1" value="8"><span id="fpsVal">8</span></label>
<button id="prevF" class="mini" title="Previous frame (,)">◀</button>
<div id="fList"></div>
<button id="nextF" class="mini" title="Next frame (.)">▶</button>
<button id="addF" class="mini" title="Add new blank frame">+ Frame</button>
<button id="dupF" class="mini" title="Duplicate current frame across all layers">Dup</button>
<button id="delF" class="mini" title="Delete current frame">✕</button>
</div>

<div id="status" class="box"></div>

<script>
(function(){
const $=i=>document.getElementById(i),gc=$('g'),gx=gc.getContext('2d'),prevC=$('prevC'),px=prevC.getContext('2d');
const dpr=Math.max(1,devicePixelRatio||1),CHUNK=128;
let W=innerWidth,H=innerHeight;
/* v.x, v.y: screen position of world pixel (0,0); v.z: screen pixels per world pixel (0.5 to 64) */
const v={x:Math.round(W/2),y:Math.round(H/2),z:12};
const S={tool:'pencil',fg:'#26262b',bg:'#f7f3ea',size:1,pxPerf:true,fillShp:false,dith:0,mode:'clutch',guide:'inf',bgStyle:'paper',grid:true,tiled:false,sym:0,symX:0,symY:0,onion:false,lx:W/2,ly:H/2,pxX:0,pxY:0,ctrl:false,ctrlX:W/2,ctrlY:H/2,clutchLock:false,pen:false,playing:false,fps:8};
const PALS={
pico8:['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'],
sweetie16:['#1a1c2c','#5d275d','#b13e53','#ef7d57','#ffcd75','#a7f070','#38b764','#257179','#29366f','#3b5dc9','#41a6f6','#73eff7','#f4f4f4','#94b0c2','#566c86','#333c57'],
gb:['#0f380f','#306230','#8bac0f','#9bbc0f'],
endesga:['#be4a2f','#d77643','#ead4aa','#e4a672','#b86f50','#733e39','#3e2731','#a22633','#e43b44','#f77622','#feae34','#fee761','#63c74d','#3e8948','#265c42','#193c3e','#124e89','#0099db','#2ce8f5','#ffffff','#c0cbdc','#8b9bb4','#5a6988','#3a4466']
};
let pal=[...PALS.pico8],layers=[],numF=1,actL=0,actF=0,hist=[],redo=[],refImg=null,D=null,curveSt=null,sel=null,clip=null,pan=null,dragSym=null,space=false,playTm=0,st=0,wheelTs=0,undoTs=0;
const h=(t,x,f,c,ti)=>{const e=document.createElement(t);e.textContent=x;if(f)e.onclick=f;if(c)e.className=c;if(ti)e.title=ti;return e};

/* Infinite Auto-Expanding Cel Engine:
   Each cel has world origin (x, y) and an offscreen canvas c of size (w, h).
   Whenever drawing reaches outside [x, y, x+w, y+h], ensureCel expands the canvas in CHUNK (128px) increments in any direction (-x, -y, +x, +y). */
function mkRawCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function mkCel(x=-64,y=-64,w=128,h=128){return{x,y,c:mkRawCanvas(w,h)}}
function cloneCel(cel){const c=mkRawCanvas(cel.c.width,cel.c.height);c.getContext('2d').drawImage(cel.c,0,0);return{x:cel.x,y:cel.y,c}}
function ensureCel(cel,x0,y0,x1,y1){
const pad=16,minX=Math.min(x0,x1)-pad,minY=Math.min(y0,y1)-pad,maxX=Math.max(x0,x1)+pad,maxY=Math.max(y0,y1)+pad;
const curX1=cel.x+cel.c.width,curY1=cel.y+cel.c.height;
if(minX>=cel.x&&minY>=cel.y&&maxX<curX1&&maxY<curY1)return false;
const nx=minX<cel.x?Math.floor(minX/CHUNK)*CHUNK:cel.x;
const ny=minY<cel.y?Math.floor(minY/CHUNK)*CHUNK:cel.y;
const nx1=maxX>=curX1?Math.ceil((maxX+1)/CHUNK)*CHUNK:curX1;
const ny1=maxY>=curY1?Math.ceil((maxY+1)/CHUNK)*CHUNK:curY1;
const nw=Math.max(CHUNK,nx1-nx),nh=Math.max(CHUNK,ny1-ny);
const nc=mkRawCanvas(nw,nh);
nc.getContext('2d').drawImage(cel.c,cel.x-nx,cel.y-ny);
cel.x=nx;cel.y=ny;cel.c=nc;return true}

function addLayer(n){const cels=[];for(let f=0;f<numF;f++)cels.push(mkCel());const l={n,vis:true,op:1,cels};layers.push(l);return l}
const curCel=()=>layers[actL]&&layers[actL].cels[actF];

/* colour helpers */
function hexRgba(hex){const v=parseInt(hex.slice(1),16);return[(v>>16)&255,(v>>8)&255,v&255,255]}
function rgbHex(r,g,b){return'#'+[r,g,b].map(x=>Math.max(0,Math.min(255,x|0)).toString(16).padStart(2,'0')).join('')}
function shadeCol(r,g,b,dir){
const hex=rgbHex(r,g,b),idx=pal.indexOf(hex);
if(idx>=0&&idx+dir>=0&&idx+dir<pal.length)return hexRgba(pal[idx+dir]);
const step=dir*18;return[Math.max(0,Math.min(255,r+step)),Math.max(0,Math.min(255,g+step)),Math.max(0,Math.min(255,b+step)),255]}

/* history: snapshot whole sprite state before mutating actions */
function snapState(){return{numF,actL,actF,layers:layers.map(l=>({n:l.n,vis:l.vis,op:l.op,cels:l.cels.map(c=>cloneCel(c))}))}}
function restoreState(s){numF=s.numF;actL=Math.min(s.actL,s.layers.length-1);actF=Math.min(s.actF,s.numF-1);
layers=s.layers.map(l=>({n:l.n,vis:l.vis,op:l.op,cels:l.cels.map(c=>cloneCel(c))}));
sel=null;curveSt=null;render();ui();save()}
function pushHist(before){hist.push(before);if(hist.length>45)hist.shift();redo=[];btns();save()}
function undo(){
undoTs=performance.now();S.ctrlX=S.lx;S.ctrlY=S.ly;
if(curveSt){curveSt=null;render();info();return}
if(D){if(D.pts&&D.pts.length>2)finish();else{D=null;S.pen=false;render();info()}}
if(!hist.length)return;
redo.push(snapState());restoreState(hist.pop());btns()}
function redoF(){
undoTs=performance.now();S.ctrlX=S.lx;S.ctrlY=S.ly;
if(D){D=null;S.pen=false}
if(!redo.length)return;
hist.push(snapState());restoreState(redo.pop());btns()}
const btns=()=>{$('bUndo').disabled=!hist.length;$('bRedo').disabled=!redo.length};

/* world pixel coordinate conversion (unbounded in (-inf, +inf)) */
const toPx=(sx,sy)=>({x:Math.floor((sx-v.x)/v.z),y:Math.floor((sy-v.y)/v.z)});

/* compute tight world pixel bounding box across visible layers */
function celOpaqueBounds(cel){
const w=cel.c.width,h=cel.c.height,d=cel.c.getContext('2d').getImageData(0,0,w,h).data;
let x0=w,y0=h,x1=-1,y1=-1;
for(let y=0;y<h;y++){const row=y*w*4;for(let x=0;x<w;x++)if(d[row+x*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
return x1<x0?null:[cel.x+x0,cel.y+y0,cel.x+x1+1,cel.y+y1+1]}

function frameBounds(fIdx=actF){
if(S.guide!='inf'){const[gw,gh]=S.guide.split('x').map(Number),hw=Math.floor(gw/2),hh=Math.floor(gh/2);
let a=-hw,b=-hh,c=gw-hw,d=gh-hh;
layers.forEach(l=>{if(!l.vis||!l.cels[fIdx])return;const q=celOpaqueBounds(l.cels[fIdx]);if(q){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])}});
return[a,b,c,d]}
let a=1e9,b=1e9,c=-1e9,d=-1e9;
layers.forEach(l=>{if(!l.vis||!l.cels[fIdx])return;const q=celOpaqueBounds(l.cels[fIdx]);if(q){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])}});
return a>c?[-16,-16,16,16]:[a,b,c,d]}

function allFramesBounds(){
let a=1e9,b=1e9,c=-1e9,d=-1e9;
for(let f=0;f<numF;f++){const q=frameBounds(f);a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])}
return a>c?[-16,-16,16,16]:[a,b,c,d]}

/* low-level pixel plotting on a working cel buffer */
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherHit(x,y,pat){
const mx=((x%4)+4)&3,my=((y%4)+4)&3,bv=BAYER[my][mx];
if(pat==0)return((x+y)&1)==0;
if(pat==1)return bv<4;
if(pat==2)return bv<12;
return((x-y)&3)==0}

function plotDot(wCel,x,y,tool,useBg){
const sz=S.size,r0=-Math.floor((sz-1)/2),r1=Math.floor(sz/2),fg=hexRgba(useBg?S.bg:S.fg),bg=hexRgba(useBg?S.fg:S.bg);
const cw=wCel.c.width,ch=wCel.c.height,ox=wCel.x,oy=wCel.y,d=wCel.id.data;
for(let dy=r0;dy<=r1;dy++)for(let dx=r0;dx<=r1;dx++){
if(sz>2&&dx*dx+dy*dy>(sz/2+.3)*(sz/2+.3))continue;
const px=x+dx,py=y+dy;
if(sel&&!sel.float&&(px<sel.x||px>=sel.x+sel.w||py<sel.y||py>=sel.y+sel.h))continue;
const lx=px-ox,ly=py-oy;if(lx<0||lx>=cw||ly<0||ly>=ch)continue;
const i=(ly*cw+lx)*4;
if(tool=='erase'){d[i]=d[i+1]=d[i+2]=d[i+3]=0}
else if(tool=='dither'){const c=ditherHit(px,py,S.dith)?fg:bg;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}
else if(tool=='shade'){if(d[i+3]==0)continue;const sc=shadeCol(d[i],d[i+1],d[i+2],useBg?-1:1);d[i]=sc[0];d[i+1]=sc[1];d[i+2]=sc[2];d[i+3]=255}
else{d[i]=fg[0];d[i+1]=fg[1];d[i+2]=fg[2];d[i+3]=255}}}

function plotSym(wCel,x,y,tool,useBg){
plotDot(wCel,x,y,tool,useBg);
const sx=2*S.symX-1-x,sy=2*S.symY-1-y;
if(S.sym==1||S.sym==3)plotDot(wCel,sx,y,tool,useBg);
if(S.sym==2||S.sym==3)plotDot(wCel,x,sy,tool,useBg);
if(S.sym==3)plotDot(wCel,sx,sy,tool,useBg)}

function ensureWorkCel(wCel,x,y){
const pad=S.size+8,sx=2*S.symX-1-x,sy=2*S.symY-1-y;
const x0=(S.sym==1||S.sym==3?Math.min(x,sx):x)-pad,x1=(S.sym==1||S.sym==3?Math.max(x,sx):x)+pad;
const y0=(S.sym==2||S.sym==3?Math.min(y,sy):y)-pad,y1=(S.sym==2||S.sym==3?Math.max(y,sy):y)+pad;
if(x0>=wCel.x&&y0>=wCel.y&&x1<wCel.x+wCel.c.width&&y1<wCel.y+wCel.c.height)return;
wCel.ctx.putImageData(wCel.id,0,0);
ensureCel(wCel,x0,y0,x1,y1);
const b= {x:wCel.base.x,y:wCel.base.y,c:cloneCel(wCel.base).c};
ensureCel(b,wCel.x,wCel.y,wCel.x+wCel.c.width-1,wCel.y+wCel.c.height-1);
wCel.base=b;
wCel.ctx=wCel.c.getContext('2d');

function bresLine(x0,y0,x1,y1){

function filterPxPerfect(pts){

const out=[pts[0]];
for(let i=1;i<pts.length-1;i++){
const p=out[out.length-1],c=pts[i],n=pts[i+1];
const lCorner=(Math.abs(p.x-c.x)+Math.abs(p.y-c.y)==1)&&(Math.abs(n.x-c.x)+Math.abs(n.y-c.y)==1)&&(p.x!=n.x&&p.y!=n.y);

function snapLineEnd(a,b,sh){
if(!sh)return b;
const dx=b.x-a.x,dy=b.y-a.y,adx=Math.abs(dx),ady=Math.abs(dy);
if(adx==0&&ady==0)return b;
const r=ady/(adx||1e-6);
if(r<.22)return{x:b.x,y:a.y};
if(r>4.5)return{x:a.x,y:b.y};
if(r>=.38&&r<=.68){const w=Math.round(adx/2)*2;return{x:a.x+(dx<0?-w:w),y:a.y+(dy<0?-w/2:w/2)}}

function shapePixels(t,a,b,ctrl,filled){
const pts=[];
if(t=='line')return bresLine(a.x,a.y,b.x,b.y);

const c=ctrl||{x:Math.round((a.x+b.x)/2),y:Math.round((a.y+b.y)/2)};

const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
if(t=='rect'){
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(filled||y==y0||y==y1||x==x0||x==x1)pts.push({x,y});
return pts}
if(t=='ell'){
const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=(x1-x0)/2,ry=(y1-y0)/2;
if(rx<.5&&ry<.5)return[{x:x0,y:y0}];
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){

function floodFillCel(cel,sx,sy,col,contig){
const fb=frameBounds(actF);
const bx0=sel?sel.x:Math.min(fb[0]-32,sx-32),by0=sel?sel.y:Math.min(fb[1]-32,sy-32);
const bx1=sel?sel.x+sel.w-1:Math.max(fb[2]+32,sx+32),by1=sel?sel.y+sel.h-1:Math.max(fb[3]+32,sy+32);
ensureCel(cel,bx0,by0,bx1,by1);
const cw=cel.c.width,ch=cel.c.height,ox=cel.x,oy=cel.y,cx=cel.c.getContext('2d'),id=cx.getImageData(0,0,cw,ch),d=id.data;

if(tr==col[0]&&tg==col[1]&&tb==col[2]&&ta==col[3])return;

for(let i=0;i<d.length;i+=4)if(d[i]==tr&&d[i+1]==tg&&d[i+2]==tb&&d[i+3]==ta){d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=col[3]}

if(nx>=minLX&&nx<=maxLX&&ny>=minLY&&ny<=maxLY&&!vis[ny*cw+nx]){
const ni=(ny*cw+nx)*4;if(d[ni]==tr&&d[ni+1]==tg&&d[ni+2]==tb&&d[ni+3]==ta){vis[ny*cw+nx]=1;q.push(nx,ny)}}})}
cx.putImageData(id,0,0)}

function drawGrad(wCel,a,b,useBg){
const fg=hexRgba(useBg?S.bg:S.fg),bg=hexRgba(useBg?S.fg:S.bg),dx=b.x-a.x,dy=b.y-a.y,L2=Math.max(1,dx*dx+dy*dy);

if(actF>0){const b=frameBounds(actF-1),oc=buildBoundedComp(actF-1,b);gx.save();gx.globalAlpha=.28;gx.filter='sepia(1) hue-rotate(-35deg) saturate(3)';gx.drawImage(oc,Math.round(ox+b[0]*z),Math.round(oy+b[1]*z),Math.round(oc.width*z),Math.round(oc.height*z));gx.restore()}

if(sel){

$('delF').disabled=numF<2;

document.querySelectorAll('#rail button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tool));
$('pxPerf').classList.toggle('on',S.pxPerf);$('fillShp').classList.toggle('on',S.fillShp);
$('gridBtn').classList.toggle('on',S.grid);$('tileBtn').classList.toggle('on',S.tiled);$('onionBtn').classList.toggle('on',S.onion);
$('clutchBtn').classList.toggle('clutch-on',isClutchActive());
$('clutchBtn').textContent=S.clutchLock?'Clutch: LOCKED':S.ctrl?'Clutch: DRAWING':'Ctrl Clutch';
btns();info()}

function info(){
const n={pencil:'Pencil',shade:'Shading Ink',dither:'Bayer Dither',erase:'Eraser',bucket:'Flood Bucket',grad:'Pixel Gradient',eyedrop:'Eyedropper',line:'Pixel Line',curve:curveSt?'Curve (move & click to bend)':'Pixel Curve',rect:'Rectangle',ell:'Oval',contour:'Filled Contour',select:'Marquee Select',move:'Move / Pan'}[S.tool];
const b=frameBounds(actF),bw=b[2]-b[0],bh=b[3]-b[1];
const cl=isClutchActive()?'<b class="cl">CTRL CLUTCH ON (glide finger to paint pixels)</b>':'hold <b>Ctrl</b> + move finger to auto-draw';
$('status').innerHTML='<b>'+n+'</b> ['+S.pxX+', '+S.pxY+'] · Bounds '+bw+'×'+bh+'px (∞ canvas · F'+(actF+1)+'/'+numF+') · '+(S.mode=='flow'?(S.pen?'<b>pen DOWN</b>':'pen UP'):cl)+' · 2-finger scroll pans · pinch zooms'}

/* persistence in localStorage */
function save(){clearTimeout(st);st=setTimeout(()=>{try{
localStorage.setItem('pixelstudio_inf1',JSON.stringify({numF,actL,actF,v:{x:v.x,y:v.y,z:v.z},l:layers.map(l=>({n:l.n,vis:l.vis,op:l.op,cels:l.cels.map(c=>({x:c.x,y:c.y,w:c.c.width,h:c.c.height,u:c.c.toDataURL()}))}))}))}catch(e){}},900)}

function load(){try{
const d=JSON.parse(localStorage.getItem('pixelstudio_inf1'));if(!d||!d.l||!d.l.length)return false;
numF=d.numF||1;actL=Math.min(d.actL|0,d.l.length-1);actF=Math.min(d.actF|0,numF-1);
if(d.v){v.x=d.v.x;v.y=d.v.y;v.z=d.v.z}
d.l.forEach(o=>{const l={n:o.n,vis:o.vis,op:o.op,cels:[]};
for(let f=0;f<numF;f++){const ci=o.cels&&o.cels[f],cel=mkCel(ci?ci.x:-64,ci?ci.y:-64,ci?ci.w:128,ci?ci.h:128);
if(ci&&ci.u){const im=new Image();im.onload=()=>{cel.c.getContext('2d').drawImage(im,0,0);render()};im.src=ci.u}
l.cels.push(cel)}
layers.push(l)});return true}catch(e){return false}}

/* seed a starter sprite centered at world (0,0) on first launch */
function seedStarter(){
addLayer('Bg');addLayer('Artwork');actL=1;
const cel=curCel(),cx=cel.c.getContext('2d'),id=cx.getImageData(0,0,cel.c.width,cel.c.height);
const art=[
"......dddd......",
"....dd9999dd....",
"...d99aaaa99d...",
"..d9aa7777aa9d..",
"..d9a71ff17a9d..",
"..d9a717717a9d..",
"..d9aa7887aa9d..",
"...d99aaaa99d...",
"....dd9999dd....",
".....d5555d.....",
"....d55cc55d....",
"....d555555d....",
".....d4..4d.....",
".....dd..dd....."
];
const map={'1':1,'4':4,'5':5,'7':7,'8':8,'9':9,'a':10,'c':12,'d':0,'f':7};
for(let y=0;y<art.length;y++)for(let x=0;x<art[y].length;x++){
const ch=art[y][x];if(ch=='.')continue;const col=hexRgba(pal[map[ch]||0]);
const wx=x-8,wy=y-7,lx=wx-cel.x,ly=wy-cel.y,i=(ly*cel.c.width+lx)*4;
id.data[i]=col[0];id.data[i+1]=col[1];id.data[i+2]=col[2];id.data[i+3]=255}
cx.putImageData(id,0,0)}

if(!load())seedStarter();
addEventListener('resize',resize);resize();ui();
})();
