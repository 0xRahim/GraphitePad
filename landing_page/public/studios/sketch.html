<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pencil Studio</title>
<style>
:root{--bg:#e9e6df;--ui:#fbfaf7;--ink:#26262b;--mute:#76736b;--line:#d9d5ca;--acc:#1f6f4a;--paper:#f7f3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1e;--ui:#2a2a2e;--ink:#ecebe6;--mute:#9a978f;--line:#3d3d42;--acc:#34a872}}
:root[data-theme="dark"]{--bg:#1b1b1e;--ui:#2a2a2e;--ink:#ecebe6;--mute:#9a978f;--line:#3d3d42;--acc:#34a872}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stack{position:fixed;inset:0;transform-origin:0 0;background:var(--paper);will-change:transform}
#stack canvas{position:absolute;left:0;top:0}
#stack canvas.blue{filter:sepia(1) hue-rotate(178deg) saturate(3.2) brightness(1.06)}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.45;mix-blend-mode:multiply}
#g{position:fixed;left:0;top:0;touch-action:none;cursor:none;outline:none}
#ring{position:fixed;left:0;top:0;border:1.5px solid #26262b;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;box-shadow:0 0 0 1px rgba(255,255,255,.7);transition:background .06s,border-color .06s}
#ring.down{background:rgba(38,38,43,.2)}
#ring.clutch{border-color:var(--acc);background:rgba(31,111,74,.22);box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.box{position:fixed;background:var(--ui);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:10}
#bar{top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);display:flex;flex-wrap:wrap;gap:5px 7px;align-items:center;justify-content:center;padding:6px 9px}
#rail{left:8px;top:106px;display:flex;flex-direction:column;gap:3px;padding:5px;width:80px;max-height:calc(100% - 160px);overflow:auto}
#panel{right:8px;top:106px;width:196px;padding:8px;max-height:calc(100% - 160px);overflow:auto}
button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 7px;cursor:pointer;transition:border-color .1s,background .1s}
button:hover,select:hover{border-color:var(--mute)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.clutch-on{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled,input:disabled{opacity:.35;cursor:default}
label{color:var(--mute);display:flex;align-items:center;gap:4px}
input[type=range]{width:64px;accent-color:var(--ink);cursor:pointer}
#panel input[type=range]{width:100%}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:4px 0;gap:6px}
#panel label input[type=range]{flex:1}
h4{margin:6px 0 4px;display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
h4:first-child{margin-top:0}
.sep{height:1px;background:var(--line);margin:2px 0}
.row{display:flex;gap:3px;margin:2px 0;align-items:center}.row .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .nm{border-color:var(--ink);font-weight:600}.mini{padding:3px 5px;font-size:11px}
.sw{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid var(--ui);outline:1px solid var(--line)}
.sw.on{outline:2px solid var(--ink)}
#sw{display:inline-flex;gap:4px;align-items:center}
input[type=color]{width:25px;height:23px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
#status{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:999px;color:var(--mute);white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis}
#status b{color:var(--ink)}
#status b.cl{color:var(--acc)}
@media(max-width:760px){#panel{display:none}}
</style></head><body>
<div id="stack"></div><div id="grain"></div><canvas id="g" tabindex="-1"></canvas><div id="ring"></div>
<div id="rail" class="box"></div>
<div id="bar" class="box">
<input type="color" id="col" value="#26262b" title="Colour"><span id="sw"></span>
<label title="Brush radius">Size<input id="size" type="range" min=".5" max="28" step=".5" value="3"></label>
<label title="Graphite darkness / flow">Dark<input id="dark" type="range" min=".1" max="1" step=".05" value=".75"></label>
<label title="Stroke smoothing for single-finger trackpad">Steady<input id="stab" type="range" min="0" max=".92" step=".04" value=".44"></label>
<select id="mode" title="Trackpad drawing mode">
<option value="clutch">Ctrl clutch + drag</option>
<option value="drag">Press &amp; drag</option>
<option value="flow">Free-flow (finger = pen)</option>
</select>
<button id="clutchBtn" title="Hold CTRL and move your finger on the mousepad to auto-draw without clicking (or click here to lock clutch)">Ctrl Clutch</button>
<select id="paper" title="Paper stock">
<option value="lined">Lined</option>
<option value="plain">Plain</option>
<option value="grid">Grid</option>
<option value="dots">Dots</option>
<option value="iso">Iso grid</option>
<option value="tan">Toned tan</option>
</select>
<select id="persp" title="Perspective guide">
<option value="0">Perspective: off</option>
<option value="1">1-point</option>
<option value="2">2-point</option>
<option value="3">3-point</option>
<option value="4">Isometric</option>
</select>
<button id="snapP" title="Snap freehand pencil &amp; ink strokes to perspective rays (or hold Shift)">Snap P</button>
<button id="mir" title="Vertical symmetry mirror (drag red axis line to reposition)">Mirror</button>
<select id="shader" title="Live canvas shader">
<option value="">Shader: none</option>
<option value="grayscale(1) contrast(2.6) brightness(1.05)">Ink B&amp;W</option>
<option value="contrast(1.32) brightness(.98)">Graphite boost</option>
<option value="invert(1) hue-rotate(190deg) saturate(1.4)">Blueprint</option>
<option value="sepia(.85) contrast(1.05)">Sepia</option>
<option value="blur(.7px) contrast(1.15) saturate(1.2)">Soft focus</option>
<option value="invert(1) grayscale(1) contrast(1.2)">Chalkboard</option>
</select>
<button id="zo" title="Zoom out (−)">−</button><button id="zv" title="Reset to 100%">100%</button><button id="zi" title="Zoom in (+)">+</button><button id="fit" title="Fit drawing to screen (0)">Fit</button>
<button id="bUndo" title="Undo (Ctrl+Z / Z)">Undo</button><button id="bRedo" title="Redo (Ctrl+Shift+Z / Y)">Redo</button>
<button id="clean" title="Fade rough sketch to 25% non-photo blue and switch to clean ink layer on top">Clean up ▸</button>
<button id="img" title="Add low-opacity reference image to draw over (or drag-drop / paste)">+ Image</button>
<button id="save" title="Export crisp PNG">Save PNG</button>
<button id="themeBtn" title="Toggle light / dark UI chrome">◐</button>
<input type="file" id="file" accept="image/*" hidden>
</div>
<div id="panel" class="box">
<h4>Layers <span><button class="mini" id="mergeL" title="Merge active layer down">⇊</button> <button class="mini" id="clr" title="Clear active layer">Clear</button> <button class="mini" id="addL" title="Add new layer">+</button></span></h4>
<div id="ll"></div>
<label>Layer opacity<input id="lop" type="range" min="0" max="1" step=".05"></label>
<h4>References <span><button class="mini" id="clrRef" title="Remove all reference images">Clear</button></span></h4>
<div id="rl"></div>
<label>Opacity<input id="rop" type="range" min="0" max="1" step=".05"></label>
<label>Scale<input id="rsc" type="range" min="5" max="400" value="100"></label>
<label>Rotate<input id="rrot" type="range" min="-180" max="180" value="0"></label>
</div>
<div id="status" class="box"></div>
<script>
(function(){
const $=i=>document.getElementById(i),stack=$('stack'),gc=$('g'),gx=gc.getContext('2d'),ring=$('ring');
const dpr=Math.max(1,devicePixelRatio||1),PI=Math.PI;
let W=innerWidth,H=innerHeight;
const v={x:0,y:0,z:1,W:W,H:H};let rv={x:0,y:0,z:1};
const S={tool:'draw',brush:'pencil',color:'#26262b',size:3,dark:.75,stab:.44,mode:'clutch',paper:'lined',persp:0,snapP:false,mirror:false,ax:0,shader:'',lx:W/2,ly:H/2,ctrl:false,ctrlX:W/2,ctrlY:H/2,clutchLock:false,pen:false};
let layers=[],refs=[],hist=[],redo=[],act=0,selRef=-1,vps=[],D=null,curveSt=null,pan=null,drag=null,space=false,tm=0,st=0,wheelTs=0,undoTs=0;
const h=(t,x,f,c,ti)=>{const e=document.createElement(t);e.textContent=x;if(f)e.onclick=f;if(c)e.className=c;if(ti)e.title=ti;return e};
const toW=(x,y)=>({x:v.x+x/v.z,y:v.y+y/v.z});
const mk=()=>{const c=document.createElement('canvas');stack.appendChild(c);return c};
const sz=c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px'};
const bgc=mk(),refc=mk();

/* paper tooth: one fixed noise map drives paper texture and where graphite catches */
const NZ=new Float32Array(65536);
(function(){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647,raw=new Float32Array(65536);
for(let i=0;i<65536;i++)raw[i]=r();
for(let y=0;y<256;y++)for(let x=0;x<256;x++){const q=raw[y*256+x]*.6+raw[((y+1)&255)*256+x]*.2+raw[y*256+((x+1)&255)]*.2;NZ[y*256+x]=Math.min(1,Math.max(0,(q-.2)*1.5))}
const t=document.createElement('canvas');t.width=t.height=256;const c=t.getContext('2d'),id=c.createImageData(256,256);
for(let j=0;j<65536;j++){const q=Math.round(255-NZ[j]*45);id.data[j*4]=id.data[j*4+1]=id.data[j*4+2]=q;id.data[j*4+3]=255}
c.putImageData(id,0,0);$('grain').style.backgroundImage='url('+t.toDataURL()+')'})();
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* brush: turns one segment of a stroke into pixels; deterministic per stroke so live == replay */
function brush(cx,s,vw,k){
const r=rng(s.seed),z=vw.z,w=s.w*z;let acc=1e9;
const X=x=>(x-vw.x)*z,Y=y=>(y-vw.y)*z;
return(x0,y0,p0,x1,y1,p1)=>{
const ax=X(x0),ay=Y(y0),bx=X(x1),by=Y(y1),d=Math.hypot(bx-ax,by-ay),t=s.t,m=w*8;
if(Math.max(ax,bx)<-m||Math.min(ax,bx)>vw.W+m||Math.max(ay,by)<-m||Math.min(ay,by)>vw.H+m)return;
if(t=='pen'||t=='erase'){cx.globalCompositeOperation=t=='erase'?'destination-out':'source-over';cx.globalAlpha=t=='erase'?1:Math.min(1,s.d*1.15);cx.strokeStyle=s.c;cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=t=='erase'?w*4.2:Math.max(.45,w*(.55+.45*p1));cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();cx.globalCompositeOperation='source-over';cx.globalAlpha=1;return}
if(t=='smudge'){const rad=Math.max(2,w*2.6),n=Math.max(1,Math.ceil(d/Math.max(1,rad*.35)));cx.fillStyle=s.c;
for(let i=1;i<=n;i++){const px=ax+(bx-ax)*i/n,py=ay+(by-ay)*i/n;cx.globalAlpha=s.d*.065*p1;cx.beginPath();cx.arc(px,py,rad,0,6.283);cx.fill();cx.globalAlpha=s.d*.11*p1;cx.beginPath();cx.arc(px,py,rad*.5,0,6.283);cx.fill()}
cx.globalAlpha=1;return}
if(t=='hatch'){const g=Math.max(2.8,w*2.1),L=w*4.8;cx.strokeStyle=s.c;cx.lineWidth=Math.max(.55,w*.18);cx.lineCap='round';cx.globalAlpha=s.d*(.5+.5*p1);acc+=d;
while(acc>=g){acc-=g;const q=(Math.max(d,1e-6)-acc)/Math.max(d,1e-6),x=ax+(bx-ax)*q,y=ay+(by-ay)*q,j=(r()-.5)*w*.35;cx.beginPath();cx.moveTo(x-L/2+j,y+L/2+j);cx.lineTo(x+L/2+j,y-L/2+j);cx.stroke()}cx.globalAlpha=1;return}
const sh=t=='shade',ch=t=='charcoal',rad=sh?w*3.5:ch?w*(.65+.5*p1)*1.45:w*(.5+.5*p1)*1.08,al=sh?.2:ch?.62+.38*p1:.46+.54*p1,step=Math.max(.5,rad*(sh?.28:.24)),n=Math.max(1,Math.ceil(d/step));
cx.fillStyle=s.c;
for(let i=1;i<=n;i++){const px=ax+(bx-ax)*i/n,py=ay+(by-ay)*i/n,c=Math.ceil(rad*rad*(sh?.5:ch?1.85:1.45))+3;
for(let j=0;j<c;j++){const a=r()*6.2832,q=Math.sqrt(r())*rad,gx=px+Math.cos(a)*q,gy=py+Math.sin(a)*q,o=NZ[(((gy*k)|0)&255)*256+(((gx*k)|0)&255)],r1=r(),r2=r();
if(o<(ch?.15:.22)&&r1<.72)continue;
cx.globalAlpha=Math.min(1,s.d*al*(.12+o*(ch?.62:.5)+r2*.15)*(1-q/rad*.45)*1.55);const e=(ch?.7:.55)+r1*(ch?.85:.68);cx.fillRect(gx,gy,e,e)}}

function drawStroke(cx,s,vw,k){const p=s.p,b=brush(cx,s,vw,k);cx.save();cx.setTransform(k,0,0,k,0,0);b(p[0],p[1],p[2],p[0],p[1],p[2]);for(let i=3;i<p.length;i+=3)b(p[i-3],p[i-2],p[i-1],p[i],p[i+1],p[i+2]);cx.restore()}
const seen=(s,vw)=>{const q=s.b;return q[2]>=vw.x&&q[0]<=vw.x+vw.W/vw.z&&q[3]>=vw.y&&q[1]<=vw.y+vw.H/vw.z};

/* rendering: layers are vector op lists, redrawn crisply after every zoom/pan; CSS transform bridges the gap */
function addLayer(n){const c=mk();sz(c);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const l={n,c,x,ops:[],vis:true,op:1,blue:false};layers.push(l);return l}
function rl(l){l.x.setTransform(1,0,0,1,0,0);l.x.clearRect(0,0,l.c.width,l.c.height);l.x.setTransform(dpr,0,0,dpr,0,0);l.ops.forEach(s=>{if(seen(s,v))drawStroke(l.x,s,v,dpr)})}
function paperCol(p){return p=='tan'?'#d8c7aa':'#f7f3ea'}
function paperPat(c,vw,p){const z=vw.z;c.strokeStyle='rgba(70,110,190,.22)';c.fillStyle='rgba(60,60,70,.35)';c.lineWidth=1;
if(p=='lined'){const g=32;if(g*z<7)return;c.beginPath();for(let y=Math.ceil(vw.y/g)*g;(y-vw.y)*z<vw.H;y+=g){const q=Math.round((y-vw.y)*z)+.5;c.moveTo(0,q);c.lineTo(vw.W,q)}c.stroke()}
else if(p=='grid'||p=='dots'){const g=24;if(g*z<6)return;const gr=p=='grid';c.beginPath();
for(let x=Math.ceil(vw.x/g)*g;(x-vw.x)*z<vw.W;x+=g){const sx=Math.round((x-vw.x)*z)+.5;if(gr){c.moveTo(sx,0);c.lineTo(sx,vw.H)}else for(let y=Math.ceil(vw.y/g)*g;(y-vw.y)*z<vw.H;y+=g)c.fillRect(sx-1,(y-vw.y)*z-1,2,2)}
if(gr)for(let y=Math.ceil(vw.y/g)*g;(y-vw.y)*z<vw.H;y+=g){const q=Math.round((y-vw.y)*z)+.5;c.moveTo(0,q);c.lineTo(vw.W,q)}c.stroke()}
else if(p=='iso'){const g=28;if(g*z<8)return;c.strokeStyle='rgba(70,110,190,.16)';const step=g*z,hStep=step*Math.sin(PI/3);c.beginPath();
for(let y=Math.ceil(vw.y/(g*Math.sin(PI/3)))*(g*Math.sin(PI/3));(y-vw.y)*z<vw.H;y+=g*Math.sin(PI/3)){const sy=(y-vw.y)*z;c.moveTo(0,sy);c.lineTo(vw.W,sy)}
const diag=vw.W+vw.H;for(let x=-diag;x<diag*2;x+=hStep*1.1547){c.moveTo(x,0);c.lineTo(x-vw.H*.57735,vw.H);c.moveTo(x,0);c.lineTo(x+vw.H*.57735,vw.H)}c.stroke()}}
function renderBg(){const c=bgc.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const pc=paperCol(S.paper);stack.style.background=pc;c.fillStyle=pc;c.fillRect(0,0,W,H);paperPat(c,v,S.paper)}
function renderRefs(){const c=refc.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);refs.forEach(r=>{if(r.vis===false)return;c.save();c.globalAlpha=r.op;const cx=(r.x+r.w/2-v.x)*v.z,cy=(r.y+r.h/2-v.y)*v.z;c.translate(cx,cy);if(r.rot)c.rotate(r.rot*PI/180);c.drawImage(r.img,-r.w*v.z/2,-r.h*v.z/2,r.w*v.z,r.h*v.z);c.restore()});c.globalAlpha=1}
function renderAll(){clearTimeout(tm);rv={x:v.x,y:v.y,z:v.z};stack.style.transform='';renderBg();renderRefs();layers.forEach(rl);guides()}
function flush(){if(v.x!=rv.x||v.y!=rv.y||v.z!=rv.z)renderAll()}
function vc(){stack.style.transform='translate('+(rv.x-v.x)*v.z+'px,'+(rv.y-v.y)*v.z+'px) scale('+v.z/rv.z+')';guides();$('zv').textContent=Math.round(v.z*100)+'%';clearTimeout(tm);tm=setTimeout(()=>{renderAll();save()},110)}
function zoomAt(sx,sy,f){const z=Math.min(512,Math.max(.005,v.z*f)),wx=v.x+sx/v.z,wy=v.y+sy/v.z;v.z=z;v.x=wx-sx/z;v.y=wy-sy/z;vc()}
function resize(){W=innerWidth;H=innerHeight;v.W=W;v.H=H;[...stack.children,gc].forEach(sz);layers.forEach(l=>l.x.setTransform(dpr,0,0,dpr,0,0));renderAll()}

/* perspective, mirror, shape preview */
function setPersp(n){S.persp=n;vps=[];if(n&&n<4){const c=toW(W/2,H/2),sw=W/v.z,sh=H/v.z;vps=n==1?[{x:c.x,y:c.y}]:[{x:c.x-.38*sw,y:c.y},{x:c.x+.38*sw,y:c.y}];if(n==3)vps.push({x:c.x,y:c.y+.75*sh})}$('persp').value=n;guides();ui()}
function snapDir(a,b,lockAng){
if(S.persp==4){const ds=[PI/6,5*PI/6,PI/2],th=lockAng!=null?lockAng:Math.atan2(b.y-a.y,b.x-a.x);let best=ds[0],bd=9;ds.forEach(d=>{const q=((th-d)%PI+PI)%PI,e=Math.min(q,PI-q);if(e<bd){bd=e;best=d}});const L=(b.x-a.x)*Math.cos(best)+(b.y-a.y)*Math.sin(best);return{x:a.x+L*Math.cos(best),y:a.y+L*Math.sin(best),ang:best}}
if(!vps.length)return b;
const ds=vps.map(p=>Math.atan2(p.y-a.y,p.x-a.x));if(S.persp==1)ds.push(0);if(S.persp<3)ds.push(PI/2);
const th=lockAng!=null?lockAng:Math.atan2(b.y-a.y,b.x-a.x);let best=ds[0],bd=9;ds.forEach(d=>{const q=((th-d)%PI+PI)%PI,e=Math.min(q,PI-q);if(e<bd){bd=e;best=d}});
const L=(b.x-a.x)*Math.cos(best)+(b.y-a.y)*Math.sin(best);return{x:a.x+L*Math.cos(best),y:a.y+L*Math.sin(best),ang:best}}
function cons(t,a,b,sh){if(t=='persp')return snapDir(a,b);if(!sh)return b;const dx=b.x-a.x,dy=b.y-a.y;
if(t=='line'){const an=Math.round(Math.atan2(dy,dx)/(PI/12))*PI/12,L=Math.hypot(dx,dy);return{x:a.x+L*Math.cos(an),y:a.y+L*Math.sin(an)}}
const m=Math.max(Math.abs(dx),Math.abs(dy));return{x:a.x+(dx<0?-m:m),y:a.y+(dy<0?-m:m)}}
function samp(P){const o=[];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)*v.z/2.5));for(let j=i?1:0;j<=n;j++)o.push(a.x+(b.x-a.x)*j/n,a.y+(b.y-a.y)*j/n)}return o}
function curvePts(a,b,c){const d=( Math.hypot(c.x-a.x,c.y-a.y)+Math.hypot(b.x-c.x,b.y-c.y) )*v.z,n=Math.min(600,Math.max(16,Math.ceil(d/2.5))),o=[];

function delL(i){if(layers.length<2)return;const l=layers[i];l.c.remove();layers.splice(i,1);hist=hist.filter(g=>g[0].l!=l);redo=redo.filter(g=>g[0].l!=l);act=Math.min(act,layers.length-1);ui();save()}
function ui(){const ll=$('ll');ll.innerHTML='';
for(let i=layers.length-1;i>=0;i--){const l=layers[i],r=h('div','',null,'row'+(i==act?' on':''));
r.append(
h('button',l.vis?'●':'○',()=>{l.vis=!l.vis;ui();save()},'mini','Show / hide layer'),
h('button',l.n,()=>{act=i;ui()},'nm','Select layer (double-click to toggle blue sketch tint)'),
h('button','B',()=>{l.blue=!l.blue;ui();save()},'mini'+(l.blue?' on':''),'Toggle non-photo blue rough sketch tint'),
h('button','✕',()=>delL(i),'mini','Delete layer'));
ll.append(r)}
layers.forEach(l=>{l.c.style.display=l.vis?'':'none';l.c.style.opacity=l.op;l.c.classList.toggle('blue',!!l.blue)});
$('lop').value=layers[act].op;$('mergeL').disabled=act<=0;

const rlist=$('rl');rlist.innerHTML='';
refs.forEach((r,i)=>{const e=h('div','',null,'row'+(i==selRef?' on':''));
e.append(
h('button',r.vis===false?'○':'●',()=>{r.vis=r.vis===false?true:false;renderRefs();ui()},'mini','Show / hide reference image'),
h('button','Image '+(i+1),()=>{selRef=i;ui()},'nm','Select reference image'),
h('button','✕',()=>{refs.splice(i,1);selRef=Math.min(selRef,refs.length-1);renderRefs();ui()},'mini','Remove reference image'));
rlist.append(e)});
const sr=refs[selRef];$('rop').disabled=$('rsc').disabled=$('rrot').disabled=!sr;$('clrRef').disabled=!refs.length;
if(sr){$('rop').value=sr.op;$('rsc').value=Math.round(sr.w/sr.base*100);$('rrot').value=sr.rot||0}
document.querySelectorAll('#rail button').forEach(b=>b.classList.toggle('on',b.dataset.k=='b'?S.tool=='draw'&&S.brush==b.dataset.t:S.tool==b.dataset.t));
document.querySelectorAll('#sw .sw').forEach(b=>b.classList.toggle('on',b.dataset.c==S.color));
$('mir').classList.toggle('on',S.mirror);
$('snapP').classList.toggle('on',S.snapP);
$('clutchBtn').classList.toggle('clutch-on',isClutchActive());
$('clutchBtn').textContent=S.clutchLock?'Clutch: LOCKED':S.ctrl?'Clutch: DRAWING':'Ctrl Clutch';
btns();info()}

function info(){
const n={draw:{pencil:'Pencil',charcoal:'Charcoal 6B',pen:'Ink pen',shade:'Shade',hatch:'Hatch',smudge:'Blend',erase:'Eraser'}[S.brush],line:'Line',curve:curveSt?'Curve (move & click to set arc)':'Curve',rect:'Rectangle',ell:'Oval',tri:'Triangle',persp:'Perspective line',move:'Move: drag images, or pan'}[S.tool];
const cl=isClutchActive()?'<b class="cl">CTRL CLUTCH ON (glide finger to draw, release Ctrl to lift)</b>':'hold <b>Ctrl</b> + move finger to auto-draw';
$('status').innerHTML='<b>'+n+'</b> · '+(S.mode=='flow'?(S.pen?'<b>pen DOWN</b>':'pen UP')+' · click or Space lifts/lowers':cl+' · or drag')+' · Ctrl+Z undo · 2-finger scroll pans · pinch zooms'}

/* reference images */
function addImg(src){const im=new Image();im.onload=()=>{const c=toW(W/2,H/2),w=Math.min(im.width,W*.68/v.z),r={img:im,w:w,h:im.height*w/im.width,base:w,op:.35,rot:0,vis:true};r.x=c.x-r.w/2;r.y=c.y-r.h/2;refs.push(r);selRef=refs.length-1;renderRefs();ui()};im.src=src}
const getF=fs=>{for(const f of fs)if(/^image\//.test(f.type))addImg(URL.createObjectURL(f))};
$('img').onclick=()=>$('file').click();$('file').onchange=e=>{getF(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();getF(e.dataTransfer.files)});
addEventListener('paste',e=>getF([...(e.clipboardData.items||[])].map(i=>i.getAsFile()).filter(Boolean)));

/* fit, export, autosave */
function bounds(){let a=1e12,b=1e12,c=-1e12,d=-1e12;layers.forEach(l=>{if(!l.vis)return;l.ops.forEach(s=>{a=Math.min(a,s.b[0]);b=Math.min(b,s.b[1]);c=Math.max(c,s.b[2]);d=Math.max(d,s.b[3])})});return a>c?null:[a,b,c,d]}
function fit(){const q=bounds();if(!q){v.z=1;v.x=-W/2;v.y=-H/2}else{const z=Math.min(16,.88*Math.min(W/(q[2]-q[0]||1),H/(q[3]-q[1]||1)));v.z=z;v.x=(q[0]+q[2])/2-W/2/z;v.y=(q[1]+q[3])/2-H/2/z}renderAll();$('zv').textContent=Math.round(v.z*100)+'%'}
$('save').onclick=()=>{const q=bounds()||[v.x,v.y,v.x+W/v.z,v.y+H/v.z];const m=40,bw=q[2]-q[0]+2*m,bh=q[3]-q[1]+2*m,z=Math.min(3,4096/Math.max(bw,bh)),o=document.createElement('canvas');o.width=Math.ceil(bw*z);o.height=Math.ceil(bh*z);
const c=o.getContext('2d'),vw={x:q[0]-m,y:q[1]-m,z:z,W:o.width,H:o.height};c.fillStyle=paperCol(S.paper);c.fillRect(0,0,o.width,o.height);paperPat(c,vw,S.paper);
layers.forEach(l=>{if(!l.vis)return;const t=document.createElement('canvas');t.width=o.width;t.height=o.height;const tc=t.getContext('2d');l.ops.forEach(s=>drawStroke(tc,s,vw,1));c.save();c.globalAlpha=l.op;if(l.blue)c.filter='sepia(1) hue-rotate(178deg) saturate(3.2) brightness(1.06)';c.drawImage(t,0,0);c.restore()});
let f=o;if(S.shader){f=document.createElement('canvas');f.width=o.width;f.height=o.height;const fc=f.getContext('2d');fc.filter=S.shader;fc.drawImage(o,0,0)}
const a=document.createElement('a');a.download='sketch.png';a.href=f.toDataURL('image/png');a.click()};
function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('pencilstudio2',JSON.stringify({l:layers.map(l=>({n:l.n,vis:l.vis,op:l.op,blue:!!l.blue,ops:l.ops})),a:act,v:{x:v.x,y:v.y,z:v.z}}))}catch(e){}},900)}
function load(){try{const d=JSON.parse(localStorage.getItem('pencilstudio2'));if(!d||!d.l||!d.l.length)return false;d.l.forEach(o=>{const l=addLayer(o.n);l.vis=o.vis;l.op=o.op;l.blue=!!o.blue;l.ops=o.ops||[];l.ops.forEach(s=>hist.push([{l,s}]))});act=Math.min(d.a|0,layers.length-1);v.x=d.v.x;v.y=d.v.y;v.z=d.v.z;return true}catch(e){return false}}

v.x=-W/2;v.y=-H/2;
if(!load()){addLayer('Rough');addLayer('Clean');act=0}
addEventListener('resize',resize);resize();ui();$('zv').textContent=Math.round(v.z*100)+'%';
})();
</script></body></html>
